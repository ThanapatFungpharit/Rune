[package]
name = "snippets"
version = "1.0.0"
edition = "2024"
description = "Sample rune-tui plugin: reusable text snippets for the message line"
publish = false

# A plugin is a WebAssembly module: `cargo build --release --target wasm32-unknown-unknown`
# (or `scripts/plugin.sh build plugins/snippets`).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune-plugin = { path = "../../plugin-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Its own workspace: not part of rune's build.
[workspace]
